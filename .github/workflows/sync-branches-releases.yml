name: Sync Branches and Releases

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 同步分支和标签
        run: |
          set -euo pipefail
          git clone --bare https://github.com/Silent1566/webhtv.git temp-repo
          cd temp-repo
          git remote set-url --push origin "https://${SYNC_TOKEN}@github.com/${{ github.repository }}.git"
          git push origin --all --tags --force
          cd ..
          rm -rf temp-repo
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}

      - name: 同步 Releases
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          SOURCE_REPO="Silent1566/webhtv"
          TARGET_REPO="${{ github.repository }}"
          PAGE=1
          PER_PAGE=100
          RELEASES_JSON=""

          while true; do
            API_URL="https://api.github.com/repos/${SOURCE_REPO}/releases?per_page=${PER_PAGE}&page=${PAGE}"
            RESPONSE=$(curl -s -H "Accept: application/vnd.github.v3+json" \
              -H "Authorization: token $GH_TOKEN" \
              "$API_URL")

            if ! echo "$RESPONSE" | jq -e 'type == "array"' > /dev/null 2>&1; then
              echo "API response is not an array"
              echo "$RESPONSE"
              exit 1
            fi

            if [ "$(echo "$RESPONSE" | jq length)" -eq 0 ]; then
              break
            fi

            if [ -z "$RELEASES_JSON" ]; then
              RELEASES_JSON="$RESPONSE"
            else
              RELEASES_JSON=$(echo "$RELEASES_JSON" "$RESPONSE" | jq -s 'add')
            fi

            PAGE=$((PAGE + 1))
            sleep 0.5
          done

          RELEASES_JSON=$(echo "$RELEASES_JSON" | jq 'sort_by(.published_at)')
          echo "$RELEASES_JSON" > releases.json

          jq -c '.[]' releases.json | while IFS= read -r release; do
            TAG_NAME=$(echo "$release" | jq -r '.tag_name')
            TITLE=$(echo "$release" | jq -r '.name // .tag_name')
            BODY=$(echo "$release" | jq -r '.body // ""')
            IS_PRERELEASE=$(echo "$release" | jq -r '.prerelease')
            IS_DRAFT=$(echo "$release" | jq -r '.draft')

            echo "Processing release: $TAG_NAME"

            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "Authorization: token $GH_TOKEN" \
              "https://api.github.com/repos/$TARGET_REPO/releases/tags/$TAG_NAME")

            if [ "$HTTP_STATUS" -eq 200 ]; then
              echo "Release exists, skipping"
              continue
            elif [ "$HTTP_STATUS" -ne 404 ]; then
              echo "Unexpected status code: $HTTP_STATUS"
            fi

            CREATE_CMD="gh release create \"$TAG_NAME\" --repo \"$TARGET_REPO\" --title \"$TITLE\""
            if [ -n "$BODY" ]; then
              echo "$BODY" > body.txt
              CREATE_CMD="$CREATE_CMD --notes-file body.txt"
            fi
            if [ "$IS_PRERELEASE" = "true" ]; then
              CREATE_CMD="$CREATE_CMD --prerelease"
            fi
            if [ "$IS_DRAFT" = "true" ]; then
              CREATE_CMD="$CREATE_CMD --draft"
            fi

            if ! eval "$CREATE_CMD"; then
              echo "Failed to create release $TAG_NAME"
              exit 1
            fi

            ASSET_URLS=$(echo "$release" | jq -r '.assets[]?.browser_download_url')
            if [ -n "$ASSET_URLS" ]; then
              TEMP_DIR=$(mktemp -d)
              cd "$TEMP_DIR"
              echo "$ASSET_URLS" | while IFS= read -r url; do
                if [ -n "$url" ]; then
                  echo "Downloading: $url"
                  curl -f -s -L -O "$url" || echo "Download failed: $url"
                fi
              done
              for file in *; do
                if [ -f "$file" ]; then
                  echo "Uploading: $file"
                  gh release upload "$TAG_NAME" "$file" --repo "$TARGET_REPO" --clobber
                fi
              done
              cd ..
              rm -rf "$TEMP_DIR"
            fi
            rm -f body.txt
          done
