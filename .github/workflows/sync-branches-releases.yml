name: Sync All

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Sync Branches and Tags
        run: |
          git clone --bare https://github.com/Silent1566/webhtv.git temp-repo
          cd temp-repo
          git remote set-url --push origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          git push origin 'refs/heads/*:refs/heads/*' --force
          git push origin 'refs/tags/*:refs/tags/*' --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SOURCE_REPO="Silent1566/webhtv"
          TARGET_REPO="${{ github.repository }}"
          PAGE=1
          PER_PAGE=100
          RELEASES_JSON=""

          while true; do
            API_URL="https://api.github.com/repos/${SOURCE_REPO}/releases?per_page=${PER_PAGE}&page=${PAGE}"
            RESPONSE=$(curl -s -H "Accept: application/vnd.github.v3+json" -H "Authorization: token $GH_TOKEN" "$API_URL")
            [ "$(echo "$RESPONSE" | jq length)" -eq 0 ] && break
            RELEASES_JSON=$(echo "$RELEASES_JSON" "$RESPONSE" | jq -s 'add')
            PAGE=$((PAGE + 1))
            sleep 0.5
          done

          RELEASES_JSON=$(echo "$RELEASES_JSON" | jq 'sort_by(.published_at)')
          echo "$RELEASES_JSON" > releases.json

          jq -c '.[]' releases.json | while IFS= read -r release; do
            TAG_NAME=$(echo "$release" | jq -r '.tag_name')
            TITLE=$(echo "$release" | jq -r '.name // .tag_name')
            BODY=$(echo "$release" | jq -r '.body // ""')
            IS_PRERELEASE=$(echo "$release" | jq -r '.prerelease')
            IS_DRAFT=$(echo "$release" | jq -r '.draft')

            echo "=============================="
            echo "Processing Release: $TAG_NAME"

            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: token $GH_TOKEN" "https://api.github.com/repos/$TARGET_REPO/releases/tags/$TAG_NAME")
            [ "$HTTP_STATUS" -eq 200 ] && { echo "Already exists, skipping."; continue; }

            CREATE_CMD="gh release create \"$TAG_NAME\" --repo \"$TARGET_REPO\" --title \"$TITLE\""
            [ -n "$BODY" ] && { echo "$BODY" > body.txt; CREATE_CMD="$CREATE_CMD --notes-file body.txt"; }
            [ "$IS_PRERELEASE" = "true" ] && CREATE_CMD="$CREATE_CMD --prerelease"
            [ "$IS_DRAFT" = "true" ] && CREATE_CMD="$CREATE_CMD --draft"

            eval "$CREATE_CMD" || { echo "Failed to create: $TAG_NAME"; exit 1; }

            ASSET_URLS=$(echo "$release" | jq -r '.assets[]?.browser_download_url // empty')
            if [ -n "$ASSET_URLS" ]; then
              TEMP_DIR=$(mktemp -d)
              cd "$TEMP_DIR"
              echo "$ASSET_URLS" | while IFS= read -r url; do
                [ -n "$url" ] && curl -f -s -L -O "$url" && echo "Downloaded: $(basename "$url")" || echo "Failed: $url"
              done
              for file in *; do
                [ -f "$file" ] && gh release upload "$TAG_NAME" "$file" --repo "$TARGET_REPO" --clobber
              done
              cd ..
              rm -rf "$TEMP_DIR"
            fi
            rm -f body.txt
          done
